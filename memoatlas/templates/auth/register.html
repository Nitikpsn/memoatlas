{% extends "base.html" %}
{% block title %}Register | MemoAtlas{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-tree">
      <div class="tree-display sprout-tree"><div class="tree-stem"></div><div class="tree-crown"><div class="tree-foliage"></div></div></div>
    </div>
    <h2>CREATE YOUR FOREST</h2>
    <p class="auth-sub">Start growing your knowledge today.</p>
    <form method="POST">
      {{ form.hidden_tag() }}
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" class="input" placeholder="Choose a username" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" class="input" placeholder="you@email.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" class="input" placeholder="At least 6 characters" required>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" name="confirm" class="input" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-full">PLANT YOUR TREE</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></p>
  </div>
</div>
{% endblock %}
