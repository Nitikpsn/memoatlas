{% extends "base.html" %}
{% block title %}Login | MemoAtlas{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-tree">
      <div class="tree-display young-tree"><div class="tree-stem"></div><div class="tree-crown"><div class="tree-foliage"></div><div class="tree-foliage s2"></div></div></div>
    </div>
    <h2>WELCOME BACK</h2>
    <p class="auth-sub">Log in to tend your forest.</p>
    <form method="POST">
      {{ form.hidden_tag() }}
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" class="input" placeholder="name@email.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" class="input" placeholder="********" required>
      </div>
      <label class="remember">
        <input type="checkbox" name="remember"> Remember me
      </label>
      <button type="submit" class="btn btn-full">LOGIN TO FOREST</button>
    </form>
    <p class="auth-foot">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
